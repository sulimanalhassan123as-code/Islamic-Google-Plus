<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Islamic Google Plus — Knowledge Garden</title>
  <link rel="stylesheet" href="styles/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <div class="logo">🕌</div>
        <div class="title">
          <div class="name">Islamic Google Plus</div>
          <div class="tag">Search Islamic resources • Ask the AI • Daily inspiration</div>
        </div>
      </div>

      <div class="right-controls">
        <button id="theme-toggle" class="btn-icon" title="Toggle theme">🌙</button>
      </div>
    </header>

    <main class="main">
      <!-- SEARCH -->
      <section class="card search-card">
        <h1 class="section-title">Search Islamic Resources</h1>
        <form id="search-form" class="search-form" autocomplete="off">
          <input id="search-input" class="input-lg" type="search" placeholder="Search topics, Prophets, Qur'an verses, scholars..." />
          <button type="submit" id="search-button" class="btn-primary">Search</button>
        </form>

        <div id="search-loading" class="muted small"> </div>
        <div id="search-results" class="results"></div>
      </section>

      <!-- ASK AI -->
      <section class="card ai-card">
        <h2 class="section-title">Ask the Islamic Assistant (Gemini 2.5 Pro)</h2>
        <textarea id="ask-input" class="textarea-lg" placeholder="Ask a respectful question..."></textarea>
        <div class="row">
          <button id="ask-button" class="btn-accent">Ask AI</button>
          <div id="ask-loading" class="muted small"></div>
        </div>
        <div id="ask-answer" class="ai-answer"></div>
      </section>

      <!-- DAILY QUOTE -->
      <section class="card quote-card">
        <h2 class="section-title">Daily Islamic Quote</h2>
        <div id="daily-quote" class="quote-text">Loading quote…</div>
        <button id="new-quote" class="btn-link small">New random quote</button>
      </section>

    </main>

    <!-- FOOTER with WhatsApp -->
    <footer class="footer">
      <div class="footer-left">
        <div>© 2025 Islamic Google Plus — Knowledge Garden</div>
      </div>

      <div class="footer-right">
        <!-- WhatsApp quick button -->
        <a id="whatsapp-button" class="btn-whatsapp" href="https://wa.me/233599931348" target="_blank" rel="noopener">
          Chat on WhatsApp
        </a>

        <!-- WhatsApp contact form (prefilled message) -->
        <div class="wa-form">
          <input id="wa-message" class="input-sm" placeholder="Write a short message to send on WhatsApp..." />
          <button id="wa-send" class="btn-primary small">Send to WhatsApp</button>
        </div>
      </div>
    </footer>
  </div>

  <script src="js/app.js" defer></script>
</body>
</html>
