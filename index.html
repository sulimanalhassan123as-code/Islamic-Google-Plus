<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Islamic Google Plus</title>
  <link rel="stylesheet" href="styles/styles.css">
  <script defer src="js/app.js"></script>
</head>
<body>
  <header>
    <h1>🕌 Islamic Google Plus</h1>
    <button id="theme-toggle" title="Toggle light/dark mode">🌙</button>
  </header>

  <main>
    <section class="search-section">
      <input type="text" id="search-input" placeholder="Search Islamic topics, prophets, Quranic verses..." />
      <button id="search-btn">🔍 Search</button>
      <div id="results"></div>
    </section>

    <section class="ask-section">
      <textarea id="ask-input" placeholder="Ask the Islamic assistant a respectful question..."></textarea>
      <button id="ask-btn">🤲 Ask AI</button>
      <div id="answer"></div>
    </section>

    <section class="extras">
      <div id="qibla">
        <h2>🧭 Qibla Direction</h2>
        <p id="qibla-info">Finding direction...</p>
      </div>

      <div id="daily-quote">
        <h2>📖 Daily Islamic Quote</h2>
        <p id="quote-text">Loading wisdom...</p>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 Islamic Google Plus | Designed with ❤️ by Suliman</p>
  </footer>
</body>
</html>
