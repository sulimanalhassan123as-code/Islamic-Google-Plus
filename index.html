<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Islamic Google Plus</title>
  <link rel="stylesheet" href="styles/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="logo">🕌 Islamic Google Plus</div>
    <button class="theme-toggle" id="theme-toggle">
      <span id="theme-icon-moon">🌙</span>
      <span id="theme-icon-sun">☀️</span>
    </button>
  </header>

  <main class="content">
    <!-- Search Section -->
    <section class="search-section">
      <h1>Search Islamic resources and ask the AI assistant</h1>
      <div class="search-bar-container">
        <form id="search-form">
          <input type="text" class="search-input" placeholder="Search topics, prophets, Quranic verses..." required>
          <button type="submit" class="search-button">Search</button>
        </form>
      </div>
      <div class="loading-message" id="loading-message"></div>
      <div id="search-results-container"></div>
    </section>

    <!-- Qibla Compass -->
    <section class="widgets">
      <div id="qibla-container">
        <h2>Qibla Direction</h2>
        <canvas id="qibla-compass" width="200" height="200"></canvas>
      </div>

      <!-- Daily Islamic Quote -->
      <div id="daily-quote">
        <h2>Daily Islamic Quote</h2>
        <div class="quote-card" id="quote-card">Loading...</div>
      </div>
    </section>

    <!-- AI Section -->
    <section class="ai-section">
      <h2>Ask the Islamic Assistant</h2>
      <div class="ai-input-container">
        <textarea id="ai-question-input" placeholder="Ask the Islamic assistant a respectful question..."></textarea>
        <button id="ai-send-btn" class="ai-send-btn">Ask</button>
      </div>
      <div id="ai-answer-container"></div>
    </section>
  </main>

  <footer>
    &copy; 2025 Islamic Google Plus | Developed by Suliman
  </footer>

  <script src="js/app.js"></script>
  <script src="js/qibla.js"></script>
  <script src="js/quotes.js"></script>
</body>
</html>
